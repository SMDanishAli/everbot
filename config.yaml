robots:
  - name: Bravo
    hours: 3        # <= 0 will throw error
    chargingCost: 2
  - name: Charlie
    hours: 5
    chargingCost: 3
  - name: Delta
    hours: 8
    chargingCost: 4

inventory:
  - type: Bravo
    source: ACTIVE
    count: 5
  - type: Charlie
    source: ACTIVE
    count: 5
  - type: Delta
    source: ACTIVE
    count: 5
  - type: Bravo
    source: STANDBY
    count: 2
  - type: Charlie
    source: STANDBY
    count: 2
  - type: Delta
    source: STANDBY
    count: 2

logging:
  level: debug          # trace | debug | info | warn | error
  directory: ./logs
  fileName: app.log
  maxSizeMb: 5
  maxFiles: 3
  sysAdmin: syed.m.danish.ali@gmail.com

database:
  path: ./data/allocation.sqlite
  busyTimeoutMs: 5000
  walMode: true
