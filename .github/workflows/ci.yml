name: CI

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

  build:
    name: Build
    needs: lint-and-test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            folder: "Everbot (Linux)"
            target: node18-linux-x64
            executable: everbot-linux-x64.bin
            archive: everbot-linux-x64.zip
          - os: macos-13
            folder: "Everbot (macOs)"
            target: node18-macos-x64
            executable: everbot-macos-x64.bin
            archive: everbot-macos-x64.zip
          - os: windows-latest
            folder: "Everbot (Windows)"
            target: node18-win-x64
            executable: everbot-win-x64.exe
            archive: everbot-win-x64.zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install pkg
        run: npm install --global pkg@5.8.1

      - name: Package executable
        shell: bash
        run: |
          mkdir -p "artifacts/${{ matrix.folder }}"
          cp config.yaml "artifacts/${{ matrix.folder }}/config.yaml"
          cp node_modules/better-sqlite3/build/Release/better_sqlite3.node "artifacts/${{ matrix.folder }}/better_sqlite3.node"
          pkg dist/cli/bundle.js --target "${{ matrix.target }}" --output "artifacts/${{ matrix.folder }}/${{ matrix.executable }}"
          chmod +x "artifacts/${{ matrix.folder }}/${{ matrix.executable }}" 2>/dev/null || true

      - name: Create Unix zip
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd "artifacts/${{ matrix.folder }}"
          zip -j "../../${{ matrix.archive }}" "${{ matrix.executable }}" config.yaml better_sqlite3.node

      - name: Create Windows zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "artifacts/${{ matrix.folder }}/*" -DestinationPath "${{ matrix.archive }}"

      - name: Upload platform zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: everbot-${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: everbot-*.zip
          path: artifacts
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
