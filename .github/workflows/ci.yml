name: Github CI for test and build

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

  build:
    name: Build
    needs: lint-and-test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            folder: "everbot-linux"
            target: node18-linux-x64
            executable: everbot
            archive: everbot-linux-x64.zip
          - os: macos-13
            folder: "everbot-macos"
            target: node18-macos-x64
            executable: everbot
            archive: everbot-macos-x64.zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.8
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build JS bundle
        run: npm run build

      - name: Install pkg
        run: npm install --global pkg@5.8.1

      - name: Package executable
        shell: bash
        run: |
          mkdir -p "artifacts/${{ matrix.folder }}"
          cp config.yaml "artifacts/${{ matrix.folder }}/config.yaml"
          cp node_modules/better-sqlite3/build/Release/better_sqlite3.node "artifacts/${{ matrix.folder }}/better_sqlite3.node"
          pkg dist/cli/bundle.js --target "${{ matrix.target }}" --output "artifacts/${{ matrix.folder }}/${{ matrix.executable }}"
          chmod +x "artifacts/${{ matrix.folder }}/${{ matrix.executable }}" 2>/dev/null || true

      - name: Create Unix zip
        shell: bash
        run: |
          cd "artifacts/${{ matrix.folder }}"
          zip -r "../../${{ matrix.archive }}" .

      - name: Upload platform zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: everbot-*.zip
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
          generate_release_notes: true
