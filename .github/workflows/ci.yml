name: CI

on:
  push:
    tags:
      - '*'

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

  build:
    name: Build
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install pkg
        run: npm install --global pkg@5.8.1

      - name: Cross-compile platform binaries
        run: |
          mkdir -p artifacts
          pkg dist/cli/bin.js --target node20-linux-x64 --output artifacts/everbot-linux-x64
          pkg dist/cli/bin.js --target node20-macos-x64 --output artifacts/everbot-macos-x64
          pkg dist/cli/bin.js --target node20-win-x64 --output artifacts/everbot-win-x64.exe

      - name: Upload cross-platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: everbot-${{ github.ref_name }}
          path: artifacts/
          if-no-files-found: error
