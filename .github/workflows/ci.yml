name: CI

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

  build:
    name: Build
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install pkg
        run: npm install --global pkg@5.8.1

      - name: Cross-compile platform binaries
        run: |
          mkdir -p "artifacts/Everbot (Linux)" "artifacts/Everbot (macOs)" "artifacts/Everbot (Windows)"
          cp config.yaml "artifacts/Everbot (Linux)/config.yaml"
          cp config.yaml "artifacts/Everbot (macOs)/config.yaml"
          cp config.yaml "artifacts/Everbot (Windows)/config.yaml"
          pkg dist/cli/bundle.js --assets "node_modules/better-sqlite3/build/Release/better_sqlite3.node" --target node18-linux-x64 --output "artifacts/Everbot (Linux)/everbot-linux-x64.bin"
          pkg dist/cli/bundle.js --assets "node_modules/better-sqlite3/build/Release/better_sqlite3.node" --target node18-macos-x64 --output "artifacts/Everbot (macOs)/everbot-macos-x64.bin"
          pkg dist/cli/bundle.js --assets "node_modules/better-sqlite3/build/Release/better_sqlite3.node" --target node18-win-x64 --output "artifacts/Everbot (Windows)/everbot-win-x64.exe"
          chmod +x "artifacts/Everbot (Linux)/everbot-linux-x64.bin" "artifacts/Everbot (macOs)/everbot-macos-x64.bin"

      - name: Upload cross-platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: everbot-${{ github.ref_name }}
          path: artifacts/
          if-no-files-found: error

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
